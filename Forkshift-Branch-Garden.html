const byId=id=>document.getElementById(id);
const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fromB64=value=>Uint8Array.from(atob(value), c=>c.charCodeAt(0));
async function verifyReceipt(branch){
  const signature=branch.receipt?.signature;
  if(!branch.receipt_bytes||signature?.algorithm!=='Ed25519')return false;
  const publicKey=fromB64(signature.public_key);
  const payload=fromB64(branch.receipt_bytes);
  const parsed=JSON.parse(new TextDecoder().decode(payload));
  const unsigned={...branch.receipt};
  delete unsigned.signature;
  const order=value=>Array.isArray(value)?value.map(order):
    value&&typeof value==='object'?Object.fromEntries(Object.keys(value).sort().map(key=>[key,order(value[key])])):value;
  if(JSON.stringify(order(parsed))!==JSON.stringify(order(unsigned)))return false;
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',publicKey)), x=>x.toString(16).padStart(2,'0')).join('');
  if(signature.device_id!=='device_'+hash.slice(0,20))return false;
  const key=await crypto.subtle.importKey('raw',publicKey,{name:'Ed25519'},false,['verify']);
  return crypto.subtle.verify({name:'Ed25519'},key,fromB64(signature.value),payload);
}
function draw(report){
  byId('garden').hidden=false;
  byId('seed').textContent=report.title;
  byId('status').textContent='Recorded evidence · no fresh workers or model calls';
  byId('scope').textContent=report.scope;
  byId('branches').innerHTML=report.branches.map((branch,index)=>{
    const ok=branch.terminal_verified===true;
    return `<article class="branch ${ok?'good':'bad'}"><span class="tag">${ok?'Terminal verified':'Terminal rejected'}</span>
      <h2>${safe(branch.label)}</h2>
      <ol class="steps">${branch.actions.map(action=>`<li>${safe(action.replaceAll('_',' '))}</li>`).join('')}</ol>
      <div class="stats">
        <div class="stat"><strong>${branch.model_calls??'—'}</strong>planner calls</div>
        <div class="stat"><strong id="signature-${index}">${branch.receipt_valid?'Recorded valid':'Unverified'}</strong>receipt signature</div>
        <div class="stat"><strong>${safe(branch.route||'—')}</strong>kernel route</div>
      </div>
      <p>${safe(branch.outcome)}</p>
      <details class="details"><summary>Inspect native Redshift receipt</summary><pre class="evidence">${safe(JSON.stringify(branch.receipt,null,2))}</pre></details>
      <details class="details"><summary>Inspect cartridge digest and provenance</summary><pre class="evidence">${safe(JSON.stringify(branch.cartridge,null,2))}</pre></details>
      <details class="details"><summary>Inspect isolated worker evidence</summary><pre class="evidence">${safe(JSON.stringify(branch.evidence,null,2))}</pre></details>
      </article>`;
  }).join('');
  byId('winner').textContent=report.winner
    ? report.winner+' is eligible for reuse. The failed branch stays in the record.'
    : 'No branch met the promotion gate.';
  byId('verify').onclick=async()=>{
    byId('verify').disabled=true;
    try{
      if(!globalThis.crypto?.subtle)throw Error('This viewer has no Web Crypto support.');
      const outcomes=await Promise.all(report.branches.map(verifyReceipt));
      outcomes.forEach((ok,index)=>{byId('signature-'+index).textContent=ok?'Verified here':'Invalid';});
      byId('status').textContent=`${outcomes.filter(Boolean).length}/${outcomes.length} Ed25519 signatures verified in this viewer`;
    }catch(error){byId('status').textContent='Signature check unavailable here · '+error.message;}
    finally{byId('verify').disabled=false;}
  };
  byId('tamper').onclick=async()=>{
    try{
      const branch=report.branches.find(row=>row.receipt?.verification);
      if(!branch)throw Error('No signed receipt is available.');
      const receipt={...branch.receipt,verification:{...branch.receipt.verification,status:'changed'}};
      const valid=await verifyReceipt({...branch,receipt});
      byId('status').textContent=valid?'Unexpected result: changed receipt accepted.':'Changed copy rejected · recorded receipts left intact';
    }catch(error){byId('status').textContent='Receipt check unavailable here · '+error.message;}
  };
  byId('download').onclick=()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download='forkshift-redshift-branch-trial.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
}
async function load(){
  try{
    if(OFFLINE_BRANCH_TRIAL){byId('back').href='Forkshift-Arcade.html';draw(OFFLINE_BRANCH_TRIAL);return;}
    const response=await fetch('/api/redshift/trial');
    if(!response.ok)throw Error('No Redshift trial is available on this server.');
    draw(await response.json());
  }catch(error){byId('status').textContent=error.message;byId('status').className='mono error';}
}
load();
</script></body></html>
